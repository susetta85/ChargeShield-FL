# Campagna v3 (2026-10-20): attacchi realistici, solo dati che il server possiede.
# RQ1 e RQ3 come la cella di base (experiment_acn_subjectdp_s5.yaml); fase: attacchi sul regime naturale.
# Cambia rispetto a experiment_acn_subjectdp_s5.yaml solo il blocco degli attacchi:
#   - lira.fonte_ombre: server -> LiRA e RMIA online e offline con ombre solo su dati
#     ausiliari del server (meta' dell'holdout per gli attacchi di ogni sito) e sulle
#     sessioni interrogate; lira.n_shadow: 32 online e lira.n_shadow_offline: 32 offline;
#   - shadow.fonte_membri: esterna -> shadow federato sui dati ausiliari del server;
#     shadow.classificatore: logistica -> anche il classificatore di tipo Shokri.
# Training, DP, split e accounting identici alla cella di base.
# ChargeShield-FL — ACN, DP per soggetto (utente), sigma 5. Uguale a experiment_acn_subjectdp.yaml salvo sigma.

experiment:
  name: chargeshield_acn_subjectdp_s5
  fl_rounds: 10
  seed: 42
  epsilon: 1.0
  delta: 1.0e-05
  max_grad_norm: 1.0
sites:
  caltech:
  - datasets/acn/caltech/acndata_sessions_2018.json
  - datasets/acn/caltech/acndata_sessions_2019.json
  - datasets/acn/caltech/acndata_sessions_2020.json
  - datasets/acn/caltech/acndata_sessions_2021.json
  jpl:
  - datasets/acn/jpl/acndata_sessions_2018.json
  - datasets/acn/jpl/acndata_sessions_2019.json
  - datasets/acn/jpl/acndata_sessions_2020.json
  - datasets/acn/jpl/acndata_sessions_2021.json
  office1:
  - datasets/acn/office1/acndata_sessions_2019.json
  - datasets/acn/office1/acndata_sessions_2020.json
  - datasets/acn/office1/acndata_sessions_2021.json
ml:
  input_dim: 6
  lr: 0.001
  epochs: 50
  batch_size: 32
  proximal_mu: 0.01
  norm: group
  subject_dp:
    enabled: true
    subject_key: user_id
    max_grad_norm: 1.0
    noise_multiplier: 5.0
    expected_subjects_per_step: 32
    max_records_per_subject: 64
    # 2026-10-16: sessioni senza userID raggruppate in profili di abitudine
    # (src/ml/profili_abitudini.py), circa 100 sessioni di training per profilo;
    # misura in docs/Segnalazioni, voce 88.
    senza_chiave: profili
    profili:
      dimensione_media: 100
      peso_gruppo: 1.0
output:
  experiments_dir: experiments
lira:
  fonte_ombre: server        # v3: ombre solo su dati del server
  n_shadow_offline: 32        # v3: ombre offline (solo dati ausiliari)
  n_shadow: 32   # v3: 32 ombre online (come --n-shadow della coda)
byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10

# Shadow v3: dati ausiliari del server e classificatore di tipo Shokri.
shadow:
  version: 2
  fonte_membri: esterna
  fraz_esterna: 0.5
  classificatore: logistica

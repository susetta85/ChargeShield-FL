# ChargeShield-FL — Calibration config, ESCALATION sito/dataset (2026-08-28)
#
# SCOPO: Fase A/A2/A3 (epoche, capacità, entropia feature — tutte su office1)
# hanno dato lo stesso esito nullo (LiRA ~0.48-0.54, nessun positive-control —
# Sprint 10ee/10jj/10kk/10ll). Quarto asse di escalation, su decisione
# esplicita dell'utente: office1 è il sito PIÙ PICCOLO e più semplice
# (8 EVSE, scelto in Fase A proprio perché "il più facile da overfittare" —
# vedi config/experiment_overfit_calibration.yaml). È possibile che la
# distribuzione dati specifica di office1 (non la capacità del modello, non
# l'entropia delle feature) renda le sessioni poco distinguibili tra loro in
# feature space, indipendentemente da quanto il modello arrivi a memorizzare
# — un problema di separabilità del pool membri/non-membri, non di
# overfitting. Questo file testa un sito diverso, con popolazione di
# EVSE/utenti diversa (Caltech, 54 EVSE contro gli 8 di Office 1).
#
# SCELTA DELLA SLICE: Caltech COMPLETO (tutti gli anni, ~31.400 sessioni,
# config/experiment.yaml) è troppo grande per una calibrazione economica —
# 1000 epoche locali su un dataset ~19x più grande di office1 avrebbe un
# costo proporzionalmente più alto (l'osservazione empirica su office1 è
# stata ~3 min/round a 1000 epoche/1344 sessioni — vedi log Sprint
# 10jj/10kk). Usato un solo anno, **Caltech 2021** (3034 sessioni, il file
# annuale più vicino in scala a office1 tra quelli disponibili sopra le
# ~1680 sessioni di office1) — una slice reale del dataset, non un
# sottocampionamento artificiale, che mantiene il costo di calibrazione
# vicino a quello di Fase A pur cambiando la popolazione sorgente.
#
# TUTTO IL RESTO invariato rispetto a Fase A: capacità storica (16, 8)/4, le
# 6 feature storiche (nessuna combinazione con Fase A2/A3 qui — quella è nel
# file "_combined", vedi accanto), no-DP, 3 round, epochs=1000, n_shadow=8.

experiment:
  name: chargeshield_overfit_calibration_altsite
  fl_rounds: 3
  seed: 42
  epsilon: 1.0
  delta: 1.0e-5
  max_grad_norm: 1.0

sites:
  caltech:
    - datasets/acn/caltech/acndata_sessions_2021.json

ml:
  input_dim: 6
  lr: 0.001
  epochs: 1000
  batch_size: 32
  proximal_mu: 0.01

output:
  experiments_dir: experiments

lira:
  n_shadow: 8

byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10

# ABLATION A --- n_shadow 8 -> 32 (2026-09-16, Sprint 10zz+118)
#
# DOMANDA: la degenerazione della calibrazione LiRA e' causata dal numero di
# shadow troppo basso? Con n_shadow=8 e inclusione al 50%, ogni record ha in
# media 4 shadow IN e 4 OUT: da 4 punti la deviazione standard empirica e'
# inservibile, quindi il floor vince il max() nel 97-99% dei casi e
# sigma_in = sigma_out = costante di round. In quel regime sigma si semplifica
# nel ranking e il punteggio LiRA si riduce a
#     (mu_in - mu_out) * (2t - mu_in - mu_out)
# cioe' la loss riscalata da un fattore per-record rumoroso: PEGGIO che non
# calibrare. E' il meccanismo che spiega l'anti-correlazione rho = -0.70 fra
# canary LiRA e canary raw-loss misurata nel Sprint 10zz+113.
#
# ATTESO: con 32 shadow (16 IN / 16 OUT per record) la std empirica dovrebbe
# superare il floor molto piu' spesso. Guardare lira_debug_sigma_*_floor_hit_rate
# (deve SCENDERE) e verificare se canary_auc_roc torna CORRELATO con
# canary_raw_mse_auc_roc invece che anti-correlato.
#
# Cella di confronto gia' disponibile: experiments/_canary_balanced_s42
# (n_shadow=8, floor_mode=symmetric). Identico a questo tranne n_shadow.
#
# TEMPO: la parte LiRA domina e scala ~linearmente in n_shadow, quindi ~4x
# rispetto ai ~13 minuti della cella a 8 shadow: attesi ~45 minuti.
#
experiment:
  name: chargeshield_canary_balanced_nshadow32
  fl_rounds: 3
  seed: 42
  epsilon: 1.0
  delta: 1.0e-5
  max_grad_norm: 1.0

sites:
  office1:
    - datasets/acn/office1/acndata_sessions_2019.json
    - datasets/acn/office1/acndata_sessions_2020.json
    - datasets/acn/office1/acndata_sessions_2021.json

ml:
  input_dim: 7
  lr: 0.001
  epochs: 1000
  batch_size: 32
  proximal_mu: 0.01
  hidden_dims: [32, 16]
  latent_dim: 8
  feature_names:
    - total_energy_kwh
    - max_power_kw
    - kwh_requested
    - minutes_available
    - hour_of_day
    - duration_hours
    - start_time_epoch

canary:
  enabled: true
  site: office1
  nonmember_source: paired_split
  swap_assignment: false      # braccio A
  n_templates: 20             # == n_nonmember_templates: condizione dello scambio
  n_duplicates: 30
  n_nonmember_templates: 20

output:
  experiments_dir: experiments

lira:
  n_shadow: 32
  # shadow_init: cold (aggiunto 2026-09-16, dopo lo smoke test s42).
  # OMESSO per errore nella prima stesura di questi config: i config
  # _canary_maxmemo{,_swap} da cui questo design deriva lo impostano a
  # "cold", mentre il default del codice e' "warm" (run_experiments.py:3250,
  # _warm_start attivo dal round 2). Lo smoke test s42 ha quindi girato con
  # gli shadow warm-start mentre la campagna a 5 seed di riferimento girava
  # cold: una variabile non controllata fra le due campagne, che tocca la
  # calibrazione shadow e quindi canary_auc_roc (NON canary_raw_mse_auc_roc,
  # che e' calcolata sulla loss del modello target e non vede gli shadow).
  # Vedi anche Blocker 1 / Sprint 10zz+91: warm e cold non sono equivalenti
  # in questo regime.
  shadow_init: cold

byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10

[project]
name = "chargeshield-fl"
version = "0.1.0"
description = "Privacy Auditing Framework for Federated Learning in OT Environments"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Assunta Imperatrice", email = "assunta.imperatrice@imtlucca.it"}
]
requires-python = ">=3.10"
keywords = ["Federated Learning", "Privacy", "IDS", "EV-charging", "FLARE"]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10",  # 2026-09-14 — bug reale trovato da un feedback esterno verificato:
                    # scripts/check_significance.py usa scipy.stats.wilcoxon per il test
                    # di Wilcoxon citato in Table 2/§7 del paper, ma scipy non era mai
                    # stato dichiarato come dipendenza — senza, lo script cade
                    # silenziosamente sul sign-test fallback (meno potente, p-value
                    # diversi) e chi ricostruisce l'ambiente dall'artifact non riproduce
                    # gli stessi numeri. Era gia' installato in questo sandbox (per
                    # questo il vero test girava qui) ma non nell'ambiente dichiarato.
    "dp-accounting>=0.4",  # 2026-09-24 — segnalazione 4: accountant RDP della DP a livello
                           # di record (src/ml/record_dp_accounting.py). Prima non era
                           # dichiarato e l'ImportError lasciava epsilon_record_dp a None
                           # senza avvisi.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
flare = [
    "nvflare>=2.7.2",  # 2026-07-24: era >=2.4, ma tutto il codice NVFLARE custom
                       # (nvflare/jobs/chargeshield_poc/) è scritto specificamente
                       # contro le API/semantiche di 2.7.2 (stessa versione in
                       # Dockerfile.flare) — >=2.4 non lo escludeva ma non lo dichiarava
]
viz = [
    "matplotlib>=3.7",  # 2026-09-03, task #54 — solo per scripts/plot_roc_log_scale.py
                        # (plot ROC log-log, richiesto dopo la discussione su Carlini
                        # et al. 2022). Import lazy nello script stesso: nessun altro
                        # modulo del progetto dipende da matplotlib, quindi resta un
                        # extra opzionale invece che una dipendenza core.
]


[build-system]

requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88


# ChargeShield-FL — NVFLARE 2.7.2 Provisioning
# Esegui: nvflare provision -p nvflare/project.yml -w nvflare/workspace

api_version: 3
name: chargeshield_fl
description: "Federated Learning for EV Charging Privacy Auditing"

participants:

  - name: server
    type: server
    org: chargeshield
    fed_learn_port: 8002
    admin_port: 8003

  # 2026-07-22: sostituiti i 4 nomi fittizi (highway/urban/residential/corporate
  # — mai stati siti realmente distinti, solo fette arbitrarie dello stesso
  # dataset) con i 3 siti REALI di ACN-Data (Caltech/JPL/Office1, verificati
  # via siteID+conteggio stazioni — vedi scripts/run_experiments.py e
  # docs/NVFlareIntegration.md). Nessun 4°/5° sito reale esiste in ACN-Data;
  # i 2 client sintetici usati per la validazione IDS (n=5, vedi
  # config/experiment.yaml byzantine_attack) esistono SOLO nella simulazione
  # single-process, non ancora portati su NVFLARE (fuori scope per ora).
  - name: caltech
    type: client
    org: chargeshield

  - name: jpl
    type: client
    org: chargeshield

  - name: office1
    type: client
    org: chargeshield

  - name: admin@chargeshield.local
    type: admin
    org: chargeshield
    role: project_admin

builders:
  - path: nvflare.lighter.impl.workspace.WorkspaceBuilder
    args:
      template_file:
        - master_template.yml

  - path: nvflare.lighter.impl.static_file.StaticFileBuilder
    args:
      config_folder: config

  - path: nvflare.lighter.impl.cert.CertBuilder

  - path: nvflare.lighter.impl.signature.SignatureBuilder

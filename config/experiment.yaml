# ChargeShield-FL — Experiment Configuration
# Usato da: scripts/run_experiments.py

experiment:
  name: chargeshield_fedmia_baseline
  #fl_rounds: 10
  fl_rounds: 100  #esperimenti finali paper
  seed: 42        # riproducibilità: usato da random.shuffle prima della split FL
  # Differential Privacy
  epsilon: 1.0
  delta: 1.0e-5
  max_grad_norm: 1.0
  # proximal_mu: rimosso — il codice legge cfg["ml"]["proximal_mu"], non cfg["experiment"]["proximal_mu"]

datasets:
  jpl_2019: datasets/acn/jpl/acndata_sessions_2019.json
  jpl_2020: datasets/acn/jpl/acndata_sessions_2020.json

# fedmia: shadow-model parameters — NON USATI
# L'implementazione usa loss-based MIA (Yeom et al. 2018), non shadow models.
# fedmia:
#   shadow_epochs: 5
#   attack_threshold: 0.5
#   n_shadow_models: 4

ml:
  input_dim: 6
  lr: 0.001
  # epochs: aumentato da 3 → 50 (Sprint 9, 2026-07-16).
  # Motivazione: no-DP baseline (5 round × 3 epochs = 15 epoche totali) ha prodotto
  # AUC=0.497 senza DP → Scenario B: il modello non memorizza con training insufficiente.
  # Con 50 epoche/round il modello overfita sui dati locali (~2615 sessioni per cluster),
  # creando il segnale di membership necessario per dimostrare che DP lo sopprime.
  # Il claim DSN 2027 "DP riduce AUC da X a 0.5" richiede prima X > 0.5 (Scenario A).
  # shadow_epochs = min(50 × fl_rounds, 500) → capped a 500 per il shadow model.
  epochs: 50
  batch_size: 32
  proximal_mu: 0.01

output:
  experiments_dir: experiments

# ── Sprint 8: Byzantine Attack Simulation ─────────────────────────────────────
# Inietta un gradient scaling attack su un nodo per validare l'IDS.
# L'attaccante moltiplica i propri pesi per scale_factor prima dell'invio
# all'aggregatore. Con scale_factor=10, il nodo è ~10× più "lontano"
# geometricamente dagli altri → Krum score >1.5 → alert reale.
#
# attack_type:
#   none            → baseline (nessun attacco, default)
#   gradient_scaling → moltiplica pesi attaccante × scale_factor
#
# byzantine_node: nome del cluster attaccante (highway, urban, residential, corporate)
# scale_factor:   intensità attacco (10 = forte, 3 = moderato, 50 = devastante)
byzantine_attack:
  enabled: false          # true = attiva attacco; false = baseline normale
  attack_type: gradient_scaling
  byzantine_node: highway  # cluster attaccante
  scale_factor: 10         # intensità: 10× → rilevabile da Krum; 3× → borderline
